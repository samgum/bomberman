<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>炸弹人 · 连接检查</title><link rel="icon" href="assets/bomb.svg"><link rel="stylesheet" href="assets/connection-check.css"><script type="module" src="app/connection-check.js"></script></head>
<body><main class="check-shell"><header><span class="edition">BOMBERMAN / FC</span><a href="./" class="small-link">回到游戏 ↗</a></header><section class="check-card"><p class="eyebrow">连接检查</p><h1>确认游戏的打开路径</h1><p class="intro">请在出现问题的安卓微信里打开本页。检测会比较正式域名与 Pages 直连入口，遇到跳转便停止。</p><div class="notes"><span>不下载安装包</span><span>不清除存档</span><span>结果只保留在本页</span></div><label class="network-label" for="network-kind">这次使用的网络</label><select id="network-kind"><option value="unknown">请选择</option><option value="wifi">Wi-Fi</option><option value="cellular">手机流量</option></select><button id="run-check" class="pixel-button">开始检查 <span aria-hidden="true">→</span></button><div id="status" role="status">准备好后点击开始检查。</div><div id="results" class="results" hidden></div><section id="report-section" hidden><div class="report-heading"><h2>检测结果</h2><button id="copy-report" class="pixel-button secondary">复制结果</button></div><p class="report-note">复制后发到当前聊天，可继续定位跳转来源。报告不包含 IP、Cookie、存档或网址参数值。</p><pre id="report"></pre></section><p class="footer-note">若本页也打不开，可使用本站的 Pages 直连检查入口。连接失败不等于 DNS 劫持，需结合两种网络的结果判断。</p></section></main></body>
</html>
